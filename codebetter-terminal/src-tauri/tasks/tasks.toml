    { en = "if line.trim().is_empty() { continue; } skips to the next line.", de = "if zeile.trim().is_empty() { continue; } springt zur nächsten Zeile." },
    { en = "The discount part from lesson 6 moves below the loop.", de = "Der Rabatt-Teil aus Lektion 6 wandert unter die Schleife." },
]

