             Fahrenheit: 23
             Warning: frost!
'''
description.de = '''
Lies die Temperatur in Celsius von der Eingabe. Warne nach den zwei
Zeilen von vorher bei 0 Grad oder weniger und bei 30 Grad oder mehr:

    0 oder weniger:   Achtung: Frost!
    30 oder mehr:     Achtung: Hitze!

    Eingabe:  -5
    Ausgabe:  === CB Thermo ===
              Celsius: -5
              Fahrenheit: 23
              Achtung: Frost!
'''
