[[task.part]]
title = { en = "Methods and loops", de = "Methoden und Schleifen" }
lesson.en = '''
A method is a named piece of code. This one takes an int and gives
back (returns) an int:

    static int twice(int x) {
        return x * 2;
    }

It goes inside class Main, next to main (not inside it). Call it
like this:  int y = twice(4);   // y is 8

A for loop repeats code. This one counts from 1 to n:

    for (int i = 1; i <= n; i++) {
        System.out.println("round " + i);
    }

  * int i = 1    runs once, before the loop
  * i <= n       is checked before every round
  * i++          runs after every round (adds 1 to i)
'''
lesson.de = '''
Eine Methode ist ein Stück Code mit Namen. Diese hier bekommt ein int
und gibt ein int zurück (return):

    static int doppelt(int x) {
        return x * 2;
    }

Sie steht in der Klasse Main neben main (nicht darin). Aufrufen
kannst du sie so:  int y = doppelt(4);   // y ist 8

Eine for-Schleife wiederholt Code. Diese zählt von 1 bis n:

    for (int i = 1; i <= n; i++) {
        System.out.println("Runde " + i);
    }

  * int i = 1    läuft einmal, vor der Schleife
  * i <= n       wird vor jeder Runde geprüft
  * i++          läuft nach jeder Runde (zählt i um 1 hoch)
'''
