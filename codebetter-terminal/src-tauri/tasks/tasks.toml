# ------------------------------------------------------------------ lesson 2

[[task.part]]
title = { en = "Variables and maths", de = "Variablen und Rechnen" }
lesson.en = '''
In C, every variable has a type before its name:

    int width = 7;          // whole number
    int area = width * 3;   // 21

Maths: +  -  *  /  and % (remainder). With int, / drops everything
after the decimal point: 7 / 2 is 3. So the order matters:
    7 * 9 / 5   is 63 / 5 = 12
    7 / 5 * 9   is 1 * 9  = 9

printf puts values into text with placeholders: %d for an int.

    printf("Area: %d\n", area);    // Area: 21
'''
lesson.de = '''
In C hat jede Variable einen Typ vor ihrem Namen:

    int breite = 7;            // ganze Zahl
    int flaeche = breite * 3;  // 21

Rechnen: +  -  *  /  und % (Rest). Bei int fällt bei / alles nach
dem Komma weg: 7 / 2 ist 3. Darum kommt es auf die Reihenfolge an:
    7 * 9 / 5   ist 63 / 5 = 12
    7 / 5 * 9   ist 1 * 9  = 9

printf setzt Werte mit Platzhaltern in Text ein: %d für ein int.

    printf("Fläche: %d\n", flaeche);    // Fläche: 21
'''
