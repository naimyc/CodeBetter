input() reads one line the user types, as text. int() turns it into
a number:

    number = int(input())

if runs a block when its condition is true. elif ("else if") is
checked only when everything before it was false, else when none
was true:

    if number > 0:
        print("positive")
    elif number == 0:
        print("zero")
    else:
        print("negative")

The colon : opens a block, and the block is everything indented
below it (4 spaces). Comparisons: <  >  <=  >=  ==  !=
'''
lesson.de = '''
input() liest eine Zeile, die der Benutzer eintippt, als Text. int()
macht daraus eine Zahl:

    zahl = int(input())

if führt einen Block aus, wenn die Bedingung wahr ist. elif ("else
if") wird nur geprüft, wenn alles davor falsch war, else, wenn
nichts wahr war:

    if zahl > 0:
        print("positiv")
    elif zahl == 0:
        print("null")
    else:
        print("negativ")

Der Doppelpunkt : öffnet einen Block, und der Block ist alles, was
darunter eingerückt ist (4 Leerzeichen). Vergleiche: <  >  <=  >=  ==  !=
'''
