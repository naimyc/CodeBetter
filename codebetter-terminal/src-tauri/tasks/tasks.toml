# ------------------------------------------------------------------ lesson 7

[[task.part]]
title = { en = "match", de = "match" }
lesson.en = '''
match compares a value with several patterns and runs the matching
branch. Like an if with many cases, but tidier:

    let day = "Sat";
    let kind = match day {
        "Sat" | "Sun" => "weekend",
        "Mon" => "start of the week",
        _ => "workday",          // _ matches everything else
    };

Rust checks that every possible value is covered. That's why text
almost always needs the _ branch at the end.

Functions can take text as &str:

    fn greeting(language: &str) -> &str {
        match language {
            "de" => "Hallo",
            _ => "Hello",
        }
    }
'''
lesson.de = '''
match vergleicht einen Wert mit mehreren Mustern und führt den
passenden Zweig aus. Wie ein if mit vielen Fällen, nur übersichtlicher:

    let tag = "Sa";
    let art = match tag {
        "Sa" | "So" => "Wochenende",
        "Mo" => "Wochenstart",
        _ => "Werktag",          // _ passt auf alles andere
    };

Rust prüft, dass jeder mögliche Wert abgedeckt ist. Darum braucht
man bei Text fast immer den Zweig _ am Ende.

Funktionen können Text als &str bekommen:

    fn begruessung(sprache: &str) -> &str {
        match sprache {
            "de" => "Hallo",
            _ => "Hello",
        }
    }
'''
description.en = '''
The shop now sells more than apples. The first input line is the
item, the second one the quantity. Write a function
price_of(item: &str) -> u32 that uses match:

    Apple => 2     Bread => 3     Milk => 1     anything else => 0

    input:   Bread
             2
    output:  === CB Shop ===
             Item: Bread
             Price: 3 Euro
             Quantity: 2
             Total: 6 Euro
             No discount
             To pay: 6 Euro
'''
description.de = '''
Der Laden verkauft jetzt mehr als Äpfel. Die erste Zeile der Eingabe
ist der Artikel, die zweite die Menge. Schreib eine Funktion
preis_von(artikel: &str) -> u32, die match benutzt:

    Apfel => 2     Brot => 3     Milch => 1     alles andere => 0

    Eingabe:  Brot
              2
    Ausgabe:  === CB Shop ===
              Artikel: Brot
              Preis: 3 Euro
              Menge: 2
              Summe: 6 Euro
              Kein Rabatt
              Zu zahlen: 6 Euro
'''
hints = [
    { en = "For the second line you need a second String and a second read_line call.", de = "Für die zweite Zeile brauchst du einen zweiten String und einen zweiten read_line-Aufruf." },
    { en = "Use item.trim() when you call price_of, otherwise \"Bread\\n\" won't match \"Bread\".", de = "Nimm artikel.trim(), wenn du preis_von aufrufst, sonst passt \"Brot\\n\" nicht zu \"Brot\"." },
    { en = "match item { \"Apple\" => 2, \"Bread\" => 3, \"Milk\" => 1, _ => 0 }", de = "match artikel { \"Apfel\" => 2, \"Brot\" => 3, \"Milch\" => 1, _ => 0 }" },
]

[[task.part.require]]
code = "match "
message = { en = "Look up the price with match.", de = "Such den Preis mit match heraus." }

[[task.part.test]]
