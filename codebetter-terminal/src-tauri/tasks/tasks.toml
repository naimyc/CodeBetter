    { en = "Forgot the & in front of celsius? Then scanf doesn't know where to write.", de = "Das & vor celsius vergessen? Dann weiß scanf nicht, wohin es schreiben soll." },
    { en = "Between 1 and 29 degrees nothing extra is printed.", de = "Zwischen 1 und 29 Grad wird nichts zusätzlich ausgegeben." },
]

