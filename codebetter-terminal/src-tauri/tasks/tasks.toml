[[task.part]]
title = { en = "Functions and loops", de = "Funktionen und Schleifen" }
lesson.en = '''
def defines a function. return gives a value back:

    def twice(x):
        return x * 2

    print(twice(4))     # 8

split() cuts a line into words, and a list comprehension turns each
word into a number:

    numbers = [int(w) for w in "3 5 8".split()]    # [3, 5, 8]

for goes through a list. enumerate(list, 1) also counts, from 1:

    for i, n in enumerate(numbers, 1):
        print(f"{i}. {n}")

sum(numbers) adds them up, len(numbers) counts them, and // divides
without the part after the decimal point:  7 // 2  is 3.
'''
lesson.de = '''
def definiert eine Funktion. return gibt einen Wert zurück:

    def doppelt(x):
        return x * 2

    print(doppelt(4))   # 8

split() zerlegt eine Zeile in Wörter, und eine List Comprehension
macht aus jedem Wort eine Zahl:

    zahlen = [int(w) for w in "3 5 8".split()]    # [3, 5, 8]

for geht eine Liste durch. enumerate(liste, 1) zählt dabei mit, ab 1:

    for i, z in enumerate(zahlen, 1):
        print(f"{i}. {z}")

sum(zahlen) addiert sie, len(zahlen) zählt sie, und // teilt ohne
Nachkommastellen:  7 // 2  ist 3.
'''
