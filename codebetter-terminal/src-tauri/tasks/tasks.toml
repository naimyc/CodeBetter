# ----------------------------------------------------------------- lesson 10

[[task.part]]
title = { en = "Handling errors", de = "Fehler behandeln" }
lesson.en = '''
unwrap() crashes the program when something goes wrong. Real
programs should handle errors instead.

parse() returns a Result: either Ok(value) or Err(error). match
handles both cases:

    match "42".parse::<u32>() {
        Ok(number) => println!("Number: {number}"),
        Err(_) => println!("That wasn't a number"),
    }

For "maybe there is a value" Rust has Option: Some(value) or None.
With it, a function can say "I don't know this one":

    fn colour_code(colour: &str) -> Option<u32> {
        match colour {
            "red" => Some(1),
            _ => None,
        }
    }

    if let Some(code) = colour_code("red") { ... }

And  continue  jumps straight to the next round of a loop.
'''
lesson.de = '''
unwrap() lässt das Programm abstürzen, wenn etwas schiefgeht.
Echte Programme sollten Fehler stattdessen behandeln.

parse() gibt ein Result zurück: entweder Ok(wert) oder Err(fehler).
Mit match behandelst du beide Fälle:

    match "42".parse::<u32>() {
        Ok(zahl) => println!("Zahl: {zahl}"),
        Err(_) => println!("Das war keine Zahl"),
    }

Für "vielleicht gibt es einen Wert" hat Rust Option: Some(wert) oder
None. Damit kann eine Funktion sagen "das kenne ich nicht":

    fn farbcode(farbe: &str) -> Option<u32> {
        match farbe {
            "rot" => Some(1),
            _ => None,
        }
    }

    if let Some(code) = farbcode("rot") { ... }

Und  continue  springt in einer Schleife direkt zur nächsten Runde.
'''
description.en = '''
Make the till robust. It must never crash:

  * unknown item           ->  Unknown item: Pizza
  * quantity not a number  ->  Invalid quantity: two

Print these messages right away while reading. Broken lines don't
become entries. Change price_of so it returns Option<u32>.

    input:   Bread 2
             Pizza 1
             Apple two
    output:  === CB Shop ===
             Unknown item: Pizza
             Invalid quantity: two
             Bread x2 = 6 Euro
             Items: 1
             Total: 6 Euro
             No discount
             To pay: 6 Euro
'''
description.de = '''
Mach die Kasse robust. Sie darf nie abstürzen:

  * unbekannter Artikel   ->  Unbekannter Artikel: Pizza
  * Menge ist keine Zahl  ->  Ungültige Menge: zwei

Gib diese Meldungen sofort beim Einlesen aus. Fehlerhafte Zeilen
werden keine Posten. Ändere preis_von so, dass es Option<u32>
zurückgibt.

    Eingabe:  Brot 2
              Pizza 1
              Apfel zwei
    Ausgabe:  === CB Shop ===
              Unbekannter Artikel: Pizza
              Ungültige Menge: zwei
              Brot x2 = 6 Euro
              Posten: 1
              Summe: 6 Euro
              Kein Rabatt
              Zu zahlen: 6 Euro
'''
hints = [
    { en = "price_of: \"Apple\" => Some(2), ..., _ => None", de = "preis_von: \"Apfel\" => Some(2), ..., _ => None" },
    { en = "let Some(price) = price_of(item) else { println!(...); continue; };", de = "let Some(preis) = preis_von(artikel) else { println!(...); continue; };" },
    { en = "Replace .parse().unwrap() with match quantity_text.parse::<u32>() { Ok(q) => q, Err(_) => { ...; continue; } }", de = "Ersetze .parse().unwrap() durch match menge_text.parse::<u32>() { Ok(m) => m, Err(_) => { ...; continue; } }" },
]

