# ------------------------------------------------------------------ lesson 2

[[task.part]]
title = { en = "Variables and types", de = "Variablen und Typen" }
lesson.en = '''
In Java, every variable has a type, written before its name:

    String city = "Berlin";     // text
    int people = 3700000;       // whole number
    double price = 4.5;         // number with a decimal point

You can't put text into an int: Java checks types before the
program runs.

The + operator joins text with other values:

    System.out.println(city + " has " + people + " people");
    // prints: Berlin has 3700000 people

Mind the spaces inside the quotes, + doesn't add any.
'''
lesson.de = '''
In Java hat jede Variable einen Typ, der vor ihrem Namen steht:

    String stadt = "Berlin";    // Text
    int einwohner = 3700000;    // ganze Zahl
    double preis = 4.5;         // Zahl mit Komma (Punkt!)

Text passt nicht in ein int: Java prüft die Typen, bevor das
Programm läuft.

Der Operator + hängt Text und andere Werte aneinander:

    System.out.println(stadt + " hat " + einwohner + " Einwohner");
    // gibt aus: Berlin hat 3700000 Einwohner

Achte auf die Leerzeichen in den Anführungszeichen, + fügt keine ein.
'''
description.en = '''
Tonight the cinema shows Matrix, and a ticket costs 9 Euro. Store the
movie in a String variable film and the price in an int variable
