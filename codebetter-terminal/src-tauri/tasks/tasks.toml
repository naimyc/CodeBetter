# ------------------------------------------------------------------ lesson 8

[[task.part]]
title = { en = "Loops", de = "Schleifen" }
lesson.en = '''
A for loop repeats code for every element:

    for i in 1..=3 {
        println!("Round {i}");     // Round 1, Round 2, Round 3
    }

1..=3 is a range from 1 up to and including 3 (1..3 would stop
before the 3).

Going through all lines of the input:

    for line in io::stdin().lines() {
        let line = line.unwrap();
        println!("read: {line}");
    }

Splitting a line into words:

    let mut parts = line.split_whitespace();
    let first = parts.next().unwrap();     // "Bread"
    let second = parts.next().unwrap();    // "2"

There's also  while condition { ... }  and  loop { ... }  (runs
forever until break).
'''
lesson.de = '''
Eine for-Schleife wiederholt Code für jedes Element:

    for i in 1..=3 {
        println!("Runde {i}");     // Runde 1, Runde 2, Runde 3
    }

1..=3 ist ein Bereich von 1 bis einschließlich 3 (1..3 würde vor
der 3 aufhören).

Alle Zeilen der Eingabe durchgehen:

    for zeile in io::stdin().lines() {
        let zeile = zeile.unwrap();
        println!("gelesen: {zeile}");
    }

Eine Zeile in Wörter zerlegen:

    let mut teile = zeile.split_whitespace();
    let erstes = teile.next().unwrap();     // "Brot"
    let zweites = teile.next().unwrap();    // "2"

Außerdem gibt es  while bedingung { ... }  und  loop { ... }  (läuft
endlos, bis break kommt).
'''
description.en = '''
Now the customer buys several items. Every input line looks like
Item Quantity. Print one line per item, and at the end the total
with the discount as before:

    input:   Bread 2
             Apple 3
    output:  === CB Shop ===
             Bread x2 = 6 Euro
             Apple x3 = 6 Euro
             Total: 12 Euro
             Discount: 1 Euro
             To pay: 11 Euro

Skip empty lines (line.trim().is_empty()). Your functions
line_total and price_of are still useful here.
'''
description.de = '''
