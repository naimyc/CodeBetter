[[task.part]]
title = { en = "scanf and if", de = "scanf und if" }
lesson.en = '''
scanf reads from the input. It needs to know where to store the
number, so you give it the address of the variable with &:

    int number;
    scanf("%d", &number);

if runs a block when its condition is true; else if and else follow
when it wasn't:

    if (number < 0) {
        printf("negative\n");
    } else if (number == 0) {
        printf("zero\n");
    } else {
        printf("positive\n");
    }

Comparisons: <  >  <=  >=  ==  !=
'''
lesson.de = '''
scanf liest von der Eingabe. Es muss wissen, wo die Zahl hin soll,
also gibst du ihm mit & die Adresse der Variable:

    int zahl;
    scanf("%d", &zahl);

if führt einen Block aus, wenn die Bedingung wahr ist; else if und
else kommen dran, wenn sie es nicht war:

    if (zahl < 0) {
        printf("negativ\n");
    } else if (zahl == 0) {
        printf("null\n");
    } else {
        printf("positiv\n");
    }

Vergleiche: <  >  <=  >=  ==  !=
'''
description.en = '''
Read the temperature in Celsius from the input. After the two lines
from before, warn at 0 degrees or less and at 30 degrees or more:

    0 or less:    Warning: frost!
    30 or more:   Warning: heat!

