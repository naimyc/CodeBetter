# ------------------------------------------------------------------ lesson 1

[[task.part]]
title = { en = "Hello, Java!", de = "Hallo, Java!" }
lesson.en = '''
In Java, all code lives inside a class. The file Main.java holds the
class Main, and the program starts in its method main:

    public class Main {
        public static void main(String[] args) {
            // your program runs here
        }
    }

The class name and the file name must match: class Main belongs in
Main.java. For now, take the line with public static void main as
it is; you'll learn what each word means later.

To print a line of text:

    System.out.println("Good evening!");

Text goes inside "double quotes", and every statement ends with a
semicolon ;   Lines starting with // are comments.
'''
lesson.de = '''
In Java steht aller Code in einer Klasse. Die Datei Main.java enthält
die Klasse Main, und das Programm startet in ihrer Methode main:

    public class Main {
        public static void main(String[] args) {
            // hier läuft dein Programm
        }
    }

Klassenname und Dateiname müssen zusammenpassen: class Main gehört
in Main.java. Die Zeile mit public static void main nimmst du erst
einmal so hin; was jedes Wort bedeutet, lernst du später.

Eine Zeile Text gibst du so aus:

    System.out.println("Guten Abend!");

Text steht in "doppelten Anführungszeichen", und jede Anweisung
endet mit einem Semikolon ;   Zeilen mit // sind Kommentare.
'''
description.en = '''
In this course you build the ticket desk of a small cinema. Every
lesson extends the same program in Main.java.

Start with the heading. Print exactly:

    === CB Cinema ===
'''
