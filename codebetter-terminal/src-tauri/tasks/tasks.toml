# ------------------------------------------------------------------ lesson 9

[[task.part]]
title = { en = "Structs and Vec", de = "Structs und Vec" }
lesson.en = '''
With struct you build your own data type out of several fields:

    struct Book {
        title: String,
        pages: u32,
    }

    let b = Book { title: String::from("Momo"), pages: 304 };
    println!("{} has {} pages", b.title, b.pages);

String is text that the struct owns itself. You turn a &str into a
String with String::from("...") or "...".to_string().

A Vec is a list that can grow:

    let mut shelf: Vec<Book> = Vec::new();
    shelf.push(b);
    println!("{} books", shelf.len());
    for book in &shelf {
        println!("{}", book.title);
    }

The & in  for book in &shelf  means: only look, don't take away.
That way you can still use shelf afterwards.
'''
lesson.de = '''
Mit struct baust du einen eigenen Datentyp aus mehreren Feldern:

    struct Buch {
        titel: String,
        seiten: u32,
    }

    let b = Buch { titel: String::from("Momo"), seiten: 304 };
    println!("{} hat {} Seiten", b.titel, b.seiten);

String ist Text, der dem Struct selbst gehört. Aus einem &str wird
ein String mit String::from("...") oder "...".to_string().

Ein Vec ist eine Liste, die wachsen kann:

    let mut regal: Vec<Buch> = Vec::new();
    regal.push(b);
    println!("{} Bücher", regal.len());
    for buch in &regal {
        println!("{}", buch.titel);
    }

Das & in  for buch in &regal  heißt: nur anschauen, nicht wegnehmen.
So kannst du regal danach weiter benutzen.
'''
