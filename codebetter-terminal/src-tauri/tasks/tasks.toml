lesson.en = '''
Every C program starts in the function main:

    #include <stdio.h>

    int main(void) {
        printf("Good morning!\n");
        return 0;
    }

  * #include <stdio.h>   brings in printf (stdio = standard input/output)
  * int main(void)       main takes nothing and returns a number
  * return 0;            0 tells the system "everything went fine"

printf does not end the line by itself: \n is the line break.
Every statement ends with a semicolon ;
'''
lesson.de = '''
Jedes C-Programm startet in der Funktion main:

    #include <stdio.h>

    int main(void) {
        printf("Guten Morgen!\n");
        return 0;
    }

  * #include <stdio.h>   holt printf dazu (stdio = Standard-Ein-/Ausgabe)
  * int main(void)       main bekommt nichts und gibt eine Zahl zurück
  * return 0;            0 sagt dem System "alles hat geklappt"

printf beendet die Zeile nicht von selbst: \n ist der Zeilenumbruch.
Jede Anweisung endet mit einem Semikolon ;
'''
description.en = '''
In this course you build a thermometer. Every lesson extends the
same program in main.c.

