# ------------------------------------------------------------------ lesson 4

[[task.part]]
title = { en = "Functions and loops", de = "Funktionen und Schleifen" }
lesson.en = '''
A function has a return type, a name and typed parameters:

    int twice(int x) {
        return x * 2;
    }

Write it above main, so C already knows it when main calls it:
twice(4) is 8.

A for loop repeats code:

    for (int i = 0; i <= 20; i += 5) {
        printf("%d\n", i);        // 0 5 10 15 20
    }

  * int i = 0    runs once, before the loop
  * i <= 20      is checked before every round
  * i += 5       runs after every round

scanf reads several numbers at once:  scanf("%d %d", &a, &b);
'''
lesson.de = '''
Eine Funktion hat einen Rückgabetyp, einen Namen und Parameter mit
Typ:

    int doppelt(int x) {
        return x * 2;
    }

Schreib sie über main, damit C sie schon kennt, wenn main sie
aufruft: doppelt(4) ist 8.

Eine for-Schleife wiederholt Code:

    for (int i = 0; i <= 20; i += 5) {
        printf("%d\n", i);        // 0 5 10 15 20
    }

  * int i = 0    läuft einmal, vor der Schleife
  * i <= 20      wird vor jeder Runde geprüft
  * i += 5       läuft nach jeder Runde

scanf liest mehrere Zahlen auf einmal:  scanf("%d %d", &a, &b);
'''
description.en = '''
Turn the thermometer into a conversion table. Move the formula into
a function  int fahrenheit(int celsius).  Read a start and an end
temperature and print one line for every 10 degrees from start up to
end (the old lines and warnings go away):

    input:   0 30
    output:  === CB Thermo ===
             0 C = 32 F
             10 C = 50 F
             20 C = 68 F
             30 C = 86 F
'''
description.de = '''
Mach aus dem Thermometer eine Umrechnungstabelle. Verschiebe die
Formel in eine Funktion  int fahrenheit(int celsius).  Lies eine
Start- und eine Endtemperatur und gib für alle 10 Grad vom Start bis
zum Ende eine Zeile aus (die alten Zeilen und Warnungen fallen weg):

    Eingabe:  0 30
    Ausgabe:  === CB Thermo ===
              0 C = 32 F
              10 C = 50 F
              20 C = 68 F
              30 C = 86 F
'''
hints = [
    { en = "scanf(\"%d %d\", &von, &bis); reads both numbers.", de = "scanf(\"%d %d\", &von, &bis); liest beide Zahlen." },
    { en = "for (int c = von; c <= bis; c += 10)", de = "for (int c = von; c <= bis; c += 10)" },
    { en = "printf(\"%d C = %d F\\n\", c, fahrenheit(c)); prints one line.", de = "printf(\"%d C = %d F\\n\", c, fahrenheit(c)); gibt eine Zeile aus." },
]

[[task.part.require]]
code = "int fahrenheit("
message = { en = "Write the function int fahrenheit(int celsius).", de = "Schreib die Funktion int fahrenheit(int celsius)." }

[[task.part.require]]
code = "for"
message = { en = "Print the table with a for loop.", de = "Gib die Tabelle mit einer for-Schleife aus." }

[[task.part.test]]
input = "0 30\n"
expected = '''
=== CB Thermo ===
0 C = 32 F
10 C = 50 F
20 C = 68 F
30 C = 86 F
'''

[[task.part.test]]
input = "-20 10\n"
expected = '''
=== CB Thermo ===
-20 C = -4 F
-10 C = 14 F
0 C = 32 F
10 C = 50 F
'''

[[task.part.test]]
input = "25 20\n"
hidden = true
expected = '''
=== CB Thermo ===
'''

[[task.part.test]]
input = "5 5\n"
hidden = true
expected = '''
=== CB Thermo ===
5 C = 41 F
'''
