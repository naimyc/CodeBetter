lesson.en = '''
A Scanner reads what the user types (the standard input):

    import java.util.Scanner;     // at the very top of the file

    Scanner scanner = new Scanner(System.in);
    int number = scanner.nextInt();

nextInt() reads the next whole number and skips spaces and line
breaks before it.

if runs code only when a condition is true, else otherwise:

    if (number < 0) {
        System.out.println("negative");
    } else {
        System.out.println("not negative");
    }

The condition goes in ( ). Comparisons: <  >  <=  >=  ==  !=
'''
lesson.de = '''
Ein Scanner liest, was der Benutzer eintippt (die Standardeingabe):

    import java.util.Scanner;     // ganz oben in die Datei

    Scanner scanner = new Scanner(System.in);
    int zahl = scanner.nextInt();

nextInt() liest die nächste ganze Zahl und überspringt Leerzeichen
und Zeilenumbrüche davor.

if führt Code nur aus, wenn eine Bedingung wahr ist, sonst else:

    if (zahl < 0) {
        System.out.println("negativ");
    } else {
        System.out.println("nicht negativ");
