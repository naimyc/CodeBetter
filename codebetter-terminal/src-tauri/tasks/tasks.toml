# ------------------------------------------------------------------ lesson 6

[[task.part]]
title = { en = "Decisions with if", de = "Entscheidungen mit if" }
lesson.en = '''
With if your program decides which code runs:

    let age = 17;
    if age >= 18 {
        println!("Welcome!");
    } else {
        println!("Sorry, too young.");
    }

Comparisons:  ==  equal         !=  not equal
              <   less          >   greater
              <=  less or equal >=  greater or equal

More cases work with else if:

    if grade == 1 { ... } else if grade <= 3 { ... } else { ... }

if can also produce a value:

    let text = if points > 50 { "won" } else { "lost" };
'''
lesson.de = '''
Mit if entscheidet dein Programm, welcher Code läuft:

    let alter = 17;
    if alter >= 18 {
        println!("Willkommen!");
    } else {
        println!("Leider zu jung.");
    }

Vergleiche:  ==  gleich          !=  ungleich
             <   kleiner         >   größer
             <=  kleiner gleich  >=  größer gleich

Mehrere Fälle gehen mit else if:

    if note == 1 { ... } else if note <= 3 { ... } else { ... }

if kann auch einen Wert liefern:

    let text = if punkte > 50 { "gewonnen" } else { "verloren" };
'''
description.en = '''
From a total of 10 Euro on, customers get 1 Euro discount. After
the total, print one of these lines, followed by the amount to pay:

    input: 5                   input: 3
    ...                        ...
    Total: 10 Euro             Total: 6 Euro
    Discount: 1 Euro           No discount
    To pay: 9 Euro             To pay: 6 Euro
'''
description.de = '''
Ab einer Summe von 10 Euro gibt es 1 Euro Rabatt. Gib nach der
Summe eine dieser Zeilen aus und danach den Betrag, der zu zahlen
ist:

    Eingabe: 5                 Eingabe: 3
    ...                        ...
    Summe: 10 Euro             Summe: 6 Euro
    Rabatt: 1 Euro             Kein Rabatt
    Zu zahlen: 9 Euro          Zu zahlen: 6 Euro
'''
hints = [
    { en = "if total >= 10 { ... } else { ... }", de = "if summe >= 10 { ... } else { ... }" },
    { en = "Keep the discount in a variable: let discount = if total >= 10 { 1 } else { 0 };", de = "Merk dir den Rabatt in einer Variablen: let rabatt = if summe >= 10 { 1 } else { 0 };" },
    { en = "To pay is total - discount.", de = "Zu zahlen ist summe - rabatt." },
]

[[task.part.require]]
code = "if "
message = { en = "Decide about the discount with if.", de = "Entscheide mit if über den Rabatt." }

[[task.part.require]]
code = "else"
message = { en = "Handle the case without discount with else.", de = "Behandle den Fall ohne Rabatt mit else." }

[[task.part.test]]
