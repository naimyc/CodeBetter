    Ausgabe:  === CB Shop ===
              Brot x2 = 6 Euro
              Apfel x3 = 6 Euro
              Posten: 2
              Summe: 12 Euro
              Rabatt: 1 Euro
              Zu zahlen: 11 Euro
'''
