# CodeBetter course catalog.
#
# Every task becomes a directory under ~/Tasks.cb/<id>/. Its parts are
# lessons: each one first teaches a concept (`lesson`), then asks you to
# extend the SAME program with it (`description`). Lesson N+1 only appears
# once `submit` passed lesson N.
#
# A test feeds `input` to the program's stdin and compares stdout with
# `expected` (trailing whitespace and trailing empty lines are ignored).
# Hidden tests don't reveal their input when they fail.
# `require` checks the source code (comments ignored, whitespace collapsed),
# so a lesson about `mut` can't be passed without using `mut`.
#
# Text fields are either one string for all languages, or translated:
#   title = { en = "Variables", de = "Variablen" }
#   lesson.en = '''...'''
#   lesson.de = '''...'''
#
# Reference solutions live in tasks/solutions/<id>/partN.rs and are
# checked by `cargo test`.

[[task]]
id = "01_rust_basics"
title = { en = "Rust Basics: CB Shop", de = "Rust-Grundlagen: CB Shop" }
summary.en = "Learn Rust from zero. In 10 lessons you build one program: the till of a small shop."
summary.de = "Rust von null an. In 10 Lektionen baust du ein Programm: die Kasse eines kleinen Ladens."
starter_file = "main.rs"
starter_code.en = '''
// CB Shop: your till, written in Rust.
// You'll extend this one program lesson by lesson.
//
// Read the lesson:        cat part1.md
// or open the editor:     edit main.rs   (lesson + hints next to your code)

fn main() {
    // Lesson 1: print the heading here
}
'''
starter_code.de = '''
// CB Shop: deine Kasse, geschrieben in Rust.
// Du erweiterst dieses eine Programm Lektion für Lektion.
//
// Lektion lesen:          cat part1.md
// oder den Editor öffnen: edit main.rs   (Lektion + Tipps neben deinem Code)

fn main() {
    // Lektion 1: gib hier die Überschrift aus
}
'''

# ------------------------------------------------------------------ lesson 1

[[task.part]]
title = { en = "Hello, Rust!", de = "Hallo, Rust!" }
lesson.en = '''
Every Rust program starts in the function main:

    fn main() {
        // your program runs here
    }

Everything between { and } belongs to main. To print text on the
screen, use println! (the ! means it's a macro, not a normal
function):

    println!("Good morning!");

Text goes inside "double quotes", and every statement ends with a
semicolon ;

Lines starting with // are comments. Rust ignores them; they are
notes for humans.
'''
lesson.de = '''
Jedes Rust-Programm startet in der Funktion main:

    fn main() {
        // hier läuft dein Programm
    }

Alles zwischen { und } gehört zu main. Um Text auf dem Bildschirm
auszugeben, benutzt du println! (das ! bedeutet, dass es ein Makro
ist und keine normale Funktion):

    println!("Guten Morgen!");

Text steht in "doppelten Anführungszeichen", und jede Anweisung
endet mit einem Semikolon ;

Zeilen, die mit // beginnen, sind Kommentare. Rust ignoriert sie,
sie sind Notizen für Menschen.
'''
description.en = '''
In this course you build the till of a small shop, step by step.
Every lesson extends the same program in main.rs.

Start with the heading of the till. Print exactly:

    === CB Shop ===
'''
description.de = '''
In diesem Kurs baust du Schritt für Schritt die Kasse eines kleinen
Ladens. Jede Lektion erweitert dasselbe Programm in main.rs.

Fang mit der Überschrift der Kasse an. Gib genau das aus:

    === CB Shop ===
'''
hints = [
    { en = "Write your println! between the { and } of main.", de = "Schreib dein println! zwischen { und } von main." },
    { en = "Three = signs, a space, CB Shop, a space, three = signs. Every character counts.", de = "Drei =, ein Leerzeichen, CB Shop, ein Leerzeichen, drei =. Jedes Zeichen zählt." },
]

[[task.part.require]]
code = "println!"
message = { en = "Print the text with println!", de = "Gib den Text mit println! aus." }

[[task.part.test]]
expected = "=== CB Shop ==="

# ------------------------------------------------------------------ lesson 2

[[task.part]]
title = { en = "Variables", de = "Variablen" }
lesson.en = '''
A variable is a name for a value. You create one with let:

    let city = "Berlin";
    let people = 3700000;

To print a variable, put {} as a placeholder into the text. Rust
fills in the values in order:

    println!("{} has {} people", city, people);
    // prints: Berlin has 3700000 people

You can also write the name directly inside the braces:

    println!("Welcome to {city}!");

Rust usually figures out the type on its own: "Berlin" is text
(&str), 3700000 is a whole number (i32).
'''
lesson.de = '''
Eine Variable ist ein Name für einen Wert. Du legst sie mit let an:

    let stadt = "Berlin";
    let einwohner = 3700000;

Um eine Variable auszugeben, schreibst du {} als Platzhalter in den
Text. Rust setzt die Werte der Reihe nach ein:

    println!("{} hat {} Einwohner", stadt, einwohner);
    // Ausgabe: Berlin hat 3700000 Einwohner

Du kannst den Namen auch direkt in die Klammern schreiben:

    println!("Willkommen in {stadt}!");

Den Typ erkennt Rust meistens selbst: "Berlin" ist Text (&str),
3700000 ist eine ganze Zahl (i32).
'''
description.en = '''
Our shop sells apples. Below the heading, create two variables:

  * item   with the value "Apple"
  * price  with the value 2

and print them like this:

    === CB Shop ===
    Item: Apple
    Price: 2 Euro
'''
description.de = '''
Unser Laden verkauft Äpfel. Lege unter der Überschrift zwei
Variablen an:

  * artikel  mit dem Wert "Apfel"
  * preis    mit dem Wert 2

und gib sie so aus:

    === CB Shop ===
    Artikel: Apfel
    Preis: 2 Euro
'''
hints = [
    { en = "let item = \"Apple\"; creates the first variable.", de = "let artikel = \"Apfel\"; legt die erste Variable an." },
    { en = "println!(\"Item: {item}\"); puts the value into the text.", de = "println!(\"Artikel: {artikel}\"); setzt den Wert in den Text ein." },
]

[[task.part.require]]
code = "let "
message = { en = "Store the values in variables with let.", de = "Speichere die Werte mit let in Variablen." }

[[task.part.test]]
expected.en = '''
=== CB Shop ===
Item: Apple
Price: 2 Euro
'''
expected.de = '''
=== CB Shop ===
Artikel: Apfel
Preis: 2 Euro
'''

# ------------------------------------------------------------------ lesson 3

[[task.part]]
title = { en = "Maths and mut", de = "Rechnen und mut" }
lesson.en = '''
You can calculate with numbers:  +  -  *  /  (and % for the remainder)

    let width = 4;
    let height = 3;
    let area = width * height;    // 12

In Rust, variables can't be changed by default. This fails:

    let points = 0;
    points = 10;           // error: cannot assign twice

If a value should change, mark the variable with mut:

    let mut points = 0;
    points = points + 10;
    points += 5;           // short for points = points + 5
    println!("{points}");  // 15

Rust's error messages are very helpful. If something doesn't
compile, read the message: it often tells you the fix.
'''
lesson.de = '''
Mit Zahlen kannst du rechnen:  +  -  *  /  (und % für den Rest)

    let breite = 4;
    let hoehe = 3;
    let flaeche = breite * hoehe;   // 12

In Rust lassen sich Variablen standardmäßig nicht ändern. Das hier
klappt nicht:

    let punkte = 0;
    punkte = 10;           // Fehler: cannot assign twice

Soll sich ein Wert ändern, markierst du die Variable mit mut:

    let mut punkte = 0;
    punkte = punkte + 10;
    punkte += 5;           // Kurzform für punkte = punkte + 5
    println!("{punkte}");  // 15

Die Fehlermeldungen von Rust sind sehr hilfreich. Wenn etwas nicht
kompiliert, lies die Meldung: Oft steht die Lösung schon drin.
'''
description.en = '''
A customer buys 3 apples. Create a variable quantity with the value
3 and a mutable variable total that starts at 0. Then add
price * quantity to total and print everything:

    === CB Shop ===
    Item: Apple
    Price: 2 Euro
    Quantity: 3
    Total: 6 Euro
'''
description.de = '''
Ein Kunde kauft 3 Äpfel. Lege eine Variable menge mit dem Wert 3 an
und eine veränderliche Variable summe, die bei 0 startet. Addiere
dann preis * menge zu summe und gib alles aus:

    === CB Shop ===
    Artikel: Apfel
    Preis: 2 Euro
    Menge: 3
    Summe: 6 Euro
'''
hints = [
    { en = "let mut total = 0; creates a variable you can change later.", de = "let mut summe = 0; legt eine Variable an, die du später ändern kannst." },
    { en = "total += price * quantity; adds the product to total.", de = "summe += preis * menge; addiert das Produkt zur Summe." },
]

[[task.part.require]]
code = "let mut "
message = { en = "Make total changeable with let mut.", de = "Mach summe mit let mut veränderlich." }

[[task.part.test]]
expected.en = '''
=== CB Shop ===
Item: Apple
Price: 2 Euro
Quantity: 3
Total: 6 Euro
'''
expected.de = '''
=== CB Shop ===
Artikel: Apfel
Preis: 2 Euro
Menge: 3
Summe: 6 Euro
'''

# ------------------------------------------------------------------ lesson 4

[[task.part]]
title = { en = "Functions", de = "Funktionen" }
lesson.en = '''
A function gives a piece of code a name, so you can reuse it. You
already know main. Your own functions go outside of main:

    fn square(number: i32) -> i32 {
        number * number
    }

  * number: i32   is a parameter: an input value with a type
  * -> i32        is the return type
  * The last line WITHOUT a semicolon is the return value.

You can call it anywhere:

    let result = square(5);    // 25

Functions always need types. i32 is a whole number with a sign,
u32 a whole number without a sign (only >= 0).
'''
lesson.de = '''
Mit einer Funktion gibst du einem Stück Code einen Namen, damit du
es wiederverwenden kannst. main kennst du schon. Eigene Funktionen
schreibst du außerhalb von main:

    fn quadrat(zahl: i32) -> i32 {
        zahl * zahl
    }

  * zahl: i32   ist ein Parameter: ein Eingabewert mit Typ
  * -> i32      ist der Rückgabetyp
  * Die letzte Zeile OHNE Semikolon ist der Rückgabewert.

Aufrufen kannst du sie überall:

    let ergebnis = quadrat(5);   // 25

Bei Funktionen musst du die Typen immer angeben. i32 ist eine ganze
Zahl mit Vorzeichen, u32 eine ganze Zahl ohne Vorzeichen (nur >= 0).
'''
description.en = '''
Write a function line_total that takes a price and a quantity (both
u32) and returns their product. Use it in main to calculate the
total.

The output stays exactly as in lesson 3. You only restructure the
code. That's called refactoring.
'''
description.de = '''
Schreib eine Funktion gesamtpreis, die einen Preis und eine Menge
bekommt (beide u32) und das Produkt zurückgibt. Benutze sie in main,
um die Summe zu berechnen.

Die Ausgabe bleibt genau wie in Lektion 3. Du baust nur den Code
um. Das nennt man Refactoring.
'''
hints = [
    { en = "fn line_total(price: u32, quantity: u32) -> u32 { ... } goes below main.", de = "fn gesamtpreis(preis: u32, menge: u32) -> u32 { ... } kommt unter main." },
    { en = "The body is one line: price * quantity, without a semicolon.", de = "Der Rumpf ist eine Zeile: preis * menge, ohne Semikolon." },
    { en = "In main: total += line_total(price, quantity);", de = "In main: summe += gesamtpreis(preis, menge);" },
]

[[task.part.require]]
code = "->"
message = { en = "Write a function that returns a value (fn name(...) -> u32).", de = "Schreib eine Funktion, die einen Wert zurückgibt (fn name(...) -> u32)." }

[[task.part.test]]
expected.en = '''
=== CB Shop ===
Item: Apple
Price: 2 Euro
Quantity: 3
Total: 6 Euro
'''
expected.de = '''
=== CB Shop ===
Artikel: Apfel
Preis: 2 Euro
Menge: 3
Summe: 6 Euro
'''

# ------------------------------------------------------------------ lesson 5

[[task.part]]
title = { en = "Reading input", de = "Eingaben lesen" }
lesson.en = '''
So far all values are fixed in the code. Now the customer should
type in the quantity. You read one line from the keyboard (the
standard input) like this:

    use std::io;      // at the very top of the file

    let mut input = String::new();        // empty, changeable text
    io::stdin().read_line(&mut input).unwrap();

Afterwards input contains e.g. "7\n", including the line break.
To turn it into a number:

    let number: u32 = input.trim().parse().unwrap();

  * trim()     removes spaces and the line break
  * parse()    turns text into a number; you choose the target
               type with  : u32
  * unwrap()   means "I'm sure this works". If it doesn't, the
               program crashes. We'll fix that in a later lesson.

You can test it with a file:
    echo 5 > input.txt
    run main.rs < input.txt
'''
lesson.de = '''
Bisher stehen alle Werte fest im Code. Jetzt soll der Kunde die
Menge eintippen. Eine Zeile von der Tastatur (der Standardeingabe)
liest du so:

    use std::io;      // ganz oben in die Datei

    let mut eingabe = String::new();      // leerer, veränderlicher Text
    io::stdin().read_line(&mut eingabe).unwrap();

Danach steht in eingabe z. B. "7\n", inklusive Zeilenumbruch.
So machst du daraus eine Zahl:

    let zahl: u32 = eingabe.trim().parse().unwrap();

  * trim()     entfernt Leerzeichen und den Zeilenumbruch
  * parse()    wandelt Text in eine Zahl um; den Zieltyp gibst du
               mit  : u32  an
  * unwrap()   heißt "Ich bin sicher, dass das klappt". Klappt es
               nicht, stürzt das Programm ab. Darum kümmern wir uns
               in einer späteren Lektion.

Testen kannst du das mit einer Datei:
    echo 5 > eingabe.txt
    run main.rs < eingabe.txt
'''
description.en = '''
Read the quantity from the input instead of fixing it at 3.
Everything else stays the same:

    input:   5
    output:  === CB Shop ===
             Item: Apple
             Price: 2 Euro
             Quantity: 5
             Total: 10 Euro
'''
description.de = '''
Lies die Menge von der Eingabe, statt sie fest auf 3 zu setzen.
Alles andere bleibt gleich:

    Eingabe:  5
    Ausgabe:  === CB Shop ===
              Artikel: Apfel
              Preis: 2 Euro
              Menge: 5
              Summe: 10 Euro
'''
hints = [
    { en = "Don't forget use std::io; in the first line of the file.", de = "Vergiss nicht use std::io; in der ersten Zeile der Datei." },
    { en = "Replace let quantity = 3; with the read_line + parse code from the lesson.", de = "Ersetze let menge = 3; durch den read_line- und parse-Code aus der Lektion." },
    { en = "Without trim(), parse() fails because of the \\n at the end.", de = "Ohne trim() scheitert parse() am \\n am Ende." },
]

[[task.part.require]]
code = "read_line"
message = { en = "Read the quantity with read_line.", de = "Lies die Menge mit read_line ein." }

[[task.part.test]]
